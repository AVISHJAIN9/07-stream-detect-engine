[package]
name = "stream-detect-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8", features = ["v4", "fast-rng", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.6"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
parking_lot = "0.12"
rand = "0.8"
memchr = "2.7"
serde_yaml = "0.9"
regex = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

